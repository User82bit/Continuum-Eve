<app-layout-main-interface>
    <main class="main">
        <header class="card-status-robot">
            <div class="status-info">
                <span [class]="'indicator-dot ' + status"></span>
                <p>O robô está atualmente: <strong>{{status}}</strong></p>
            </div>
            <button class="details-btn">
                Ver Detalhes <span>></span>
            </button>
        </header>

        <section class="secondary">
            <app-card>
                <p>Nível de bateria: <b>{{batery}}%</b></p>
            </app-card>
            <app-card>
                <p>Plantas plantadas: <b>{{TPlanted}}</b></p>
                <p>Plantas plantadas hoje: <b>{{AcPlanted}}</b></p>
            </app-card>
            <app-card>
                <p>Distância detectada: <b>{{ distance ?? '--' }}cm</b></p>
            </app-card>
        </section>
    </main>
</app-layout-main-interface>

@if (isMapTrue) {
    <app-map-info-component (isReturn)="ToggleMap()"/>
}
