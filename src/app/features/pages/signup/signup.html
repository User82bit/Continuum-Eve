<app-default-login-layout
  title="Crie sua conta"
  primaryButtonText="Criar conta"
  secondaryButtonText="Já tenho uma conta"
  (onSubmit)="submit()"
  (onNavigate)="navigate()"
  [disablePrimaryButton]="SignupForm.invalid"
>
  <form class="auth-form" [formGroup]="SignupForm" (keydown.enter)="handleEnter($event)">
    <app-primary-input formControlName="username" type="text" inputName="username" autocomplete="name" label="Nome" placeHolder="Seu nome completo">
      <img src="assets/svg/user-icon.svg" alt="" />
    </app-primary-input>
    <app-primary-input formControlName="email" type="email" inputName="email" autocomplete="email" label="E-mail" placeHolder="voce@exemplo.com">
      <img src="assets/svg/email-icon.svg" alt="" />
    </app-primary-input>
    <app-primary-input formControlName="password" type="password" inputName="password" autocomplete="new-password" label="Senha" placeHolder="Mínimo de 6 caracteres">
      <img src="assets/svg/password-icon.svg" alt="" />
    </app-primary-input>
    <app-primary-input formControlName="passwordConfirme" type="password" inputName="passwordConfirme" autocomplete="new-password" label="Confirmar senha" placeHolder="Digite a senha novamente">
      <img src="assets/svg/password-icon.svg" alt="" />
    </app-primary-input>
    @if (SignupForm.hasError('passwordMismatch') && SignupForm.controls.passwordConfirme.touched) {
      <p class="form-error">As senhas não coincidem.</p>
    }
  </form>
</app-default-login-layout>
