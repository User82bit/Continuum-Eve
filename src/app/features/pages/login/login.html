<app-default-login-layout
  title="Bem-vindo de volta"
  primaryButtonText="Entrar"
  secondaryButtonText="Criar uma conta"
  (onSubmit)="submit()"
  (onNavigate)="navigate()"
  [disablePrimaryButton]="loginForm.invalid"
>
  <form class="auth-form" [formGroup]="loginForm" (keydown.enter)="handleEnter($event)">
    <app-primary-input
      formControlName="email"
      type="email"
      inputName="email"
      autocomplete="email"
      label="E-mail"
      placeHolder="voce@exemplo.com"
    >
      <img src="assets/svg/email-icon.svg" alt="" />
    </app-primary-input>
    <app-primary-input
      formControlName="password"
      type="password"
      inputName="password"
      autocomplete="current-password"
      label="Senha"
      placeHolder="Digite sua senha"
    >
      <img src="assets/svg/password-icon.svg" alt="" />
    </app-primary-input>
    <button type="button" class="route-clear" (click)="handleForgotPassword()" [disabled]="isDisabled">
      Esqueceu a senha?
    </button>
  </form>
</app-default-login-layout>
