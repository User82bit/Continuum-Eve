<section class="map-section">
    <aside class="side-bar">
        <header class="primary-section">
            <h1>Mapa de Monitoramento</h1>
            <button class="close-btn" (click)="return()">✕</button>
        </header>

        <div class="data-section">
            <app-card>
                <div class="auto-display">
                    <p>Status da Conexão:</p>
                    <p><b>Online</b></p>
                </div>
            </app-card>
            <app-card>
                <div class="auto-display">
                    <p>Coordenadas:</p>
                    <p><b>0.0, 0.0</b></p>
                </div>
            </app-card>
        </div>
    </aside>

    <main class="display">
        <div class="map-canvas">
            <canvas id="mapCanvas"></canvas>
        </div>
    </main>
</section>
