<div class="input-wrapper">
  <label [for]="inputName()">{{ label() }}</label>
  <div class="input-content">
    <input
      [id]="inputName()"
      [name]="inputName()"
      [type]="type()"
      [value]="value"
      [disabled]="disabled"
      [placeholder]="placeHolder()"
      [attr.autocomplete]="autocomplete()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
    <span class="icon" aria-hidden="true">
      <ng-content></ng-content>
    </span>
  </div>
</div>
